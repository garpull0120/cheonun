<style>

.cw-w01 .cw-link{font-size:14px;border-bottom:1px solid #b3b9c8;padding-bottom:4px;white-space:nowrap}

@media (max-width:900px){.cw-w01 .cw{padding:0 8px}.cw-w01 .cw-in{padding:32px 25px}}
@media (max-width:560px){.cw-w01 .cw-in{padding:28px 20px}.cw-w01 .cw-head h2{font-size:25px}.cw-w01 .cw-tag{display:none}.cw-w01 .cw-link{font-size:12px}}
@media (prefers-reduced-motion:reduce){.cw-w01 .cw *{transition:none!important}}

.cw-w01 .cw-hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(13,18,30,.86),rgba(13,18,30,.3) 65%,rgba(13,18,30,.08))}
.cw-w01 .cw-hero__copy{position:relative;z-index:2;padding:96px 58px 120px;max-width:900px}

.cw-w01 .cw-hero h1{font-size:clamp(40px,5vw,70px);line-height:1.16;letter-spacing:-.075em;font-weight:800;margin-bottom:25px}

.cw-w01 .cw-hero__note{position:absolute;z-index:2;right:40px;bottom:76px;border-left:1px solid #ffffff80;padding-left:18px;font-size:14px;line-height:1.8;color:#f6f3f9}
.cw-w01 .cw-hero__toggle{position:absolute;z-index:3;top:22px;right:22px;height:42px;padding:0 16px 0 13px;gap:8px;border-radius:999px;border:1px solid #ffffffb3;background:#0d121ed9;color:#fff;font:600 14px/1 inherit;letter-spacing:-.01em;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px #00000040;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .2s}.cw-w01 .cw-hero__toggle:hover{background:#000000e6}.cw-w01 .cw-hero__toggle:focus-visible{outline:3px solid #fff;outline-offset:3px}.cw-w01 .cw-hero__toggle .t-play{display:none}.cw-w01 .cw-hero__toggle.is-paused .t-play{display:inline}.cw-w01 .cw-hero__toggle.is-paused .t-pause{display:none}
.cw-w01 .cw-hero__toggle.is-show{display:flex}
.cw-w01 .cw-hero__toggle svg{width:14px;height:14px;fill:currentColor;flex:none}
.cw-w01 .cw-hero__toggle .i-play{display:none}
.cw-w01 .cw-hero__toggle.is-paused .i-play{display:block}
.cw-w01 .cw-hero__toggle.is-paused .i-pause{display:none}
@media (max-width:900px){
  .cw-w01 .cw-hero{min-height:590px}
  .cw-w01 .cw-hero__copy{padding:96px 30px 100px}
  .cw-w01 .cw-hero__note{display:none}
}
@media (max-width:560px){
  .cw-w01 .cw-hero{min-height:600px}
  .cw-w01 .cw-hero::before{background:linear-gradient(180deg,rgba(13,18,30,.45),rgba(13,18,30,.78) 55%,rgba(13,18,30,.6))}
  .cw-w01 .cw-hero__copy{padding:80px 22px 90px}
  .cw-w01 .cw-eyebrow{font-size:12.5px;letter-spacing:.06em}
  .cw-w01 .cw-hero h1{font-size:clamp(30px,8.4vw,43px)}
  .cw-w01 .cw-hero h1 span{white-space:normal}
  .cw-w01 .cw-hero__copy p{font-size:16px}
  .cw-w01 .cw-hero__btns .cw-pill{flex:1 1 100%}
  .cw-w01 .cw-hero__toggle{top:14px;right:14px;height:38px;font-size:13px;padding:0 13px 0 11px}
}
</style>
<div class="cw-w01">

<section class="cw" aria-label="천운에어컨 소개">
  <div class="cw-hero">
    <!-- 영상: data-src(PC) / data-src-mobile(모바일) 주소만 바꾸면 교체됨. 데이터 절약 모드에선 포스터만 보임 -->
    <video id="cwHeroVideo" muted loop playsinline preload="none" poster="https://cdn.jsdelivr.net/gh/garpull0120/cheonun@7f6e5ccea7bcf5a5580ac49e0f22fb6c3fa2f2e0/hero_poster.jpg" data-src="https://cdn.jsdelivr.net/gh/garpull0120/cheonun@7f6e5ccea7bcf5a5580ac49e0f22fb6c3fa2f2e0/hero.mp4" data-src-mobile="https://cdn.jsdelivr.net/gh/garpull0120/cheonun@7f6e5ccea7bcf5a5580ac49e0f22fb6c3fa2f2e0/hero_mobile.mp4" aria-hidden="true"></video>
    <button type="button" class="cw-hero__toggle" id="cwHeroToggle" aria-label="배경 영상 일시정지">
      <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg>
      <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z"/></svg>
      <span class="t-pause">영상 멈춤</span><span class="t-play">영상 재생</span>
    </button>
    <div class="cw-hero__copy">
      <p class="cw-eyebrow">가정집 · 상가 · 학원 · 병원 · 학교 · 기숙사 · 모텔 · 호텔 · 리조트 · 실버타운<strong>에어컨 완전분해 세척</strong></p>
      <h1>
        <span>손님은 말하지 않습니다.</span>
        <span>그냥 다음에</span>
        <span>오지 않을 뿐입니다.</span>
      </h1>
      <p>매장은 매일 쓸고 닦으시죠. 그런데 공기를 책임지는 에어컨 속은 보이지 않습니다.<br>저희가 끝까지 분해해서, 눈으로 확인시켜 드리겠습니다.</p>

    </div>
    <div class="cw-hero__note">오픈 전 · 마감 후 · 주말 작업<br>세척 전·후 사진을 꼭 보내드립니다.</div>
  </div>

</div>

<script>
(function(){
  var v=document.getElementById('cwHeroVideo'),btn=document.getElementById('cwHeroToggle');
  if(!v)return;
  function ok(u){return u&&u.indexOf('[')!==0;}
  var src=v.getAttribute('data-src'),msrc=v.getAttribute('data-src-mobile');
  if(window.innerWidth<860&&ok(msrc))src=msrc;
  var saveData=navigator.connection&&navigator.connection.saveData;
  if(!ok(v.getAttribute('poster')))v.removeAttribute('poster');
  if(!ok(src)||saveData)return;
  function sync(){btn.classList.toggle('is-paused',v.paused);btn.setAttribute('aria-label',v.paused?'배경 영상 재생':'배경 영상 일시정지');}
  v.src=src;v.preload='auto';
  btn.classList.add('is-show');
  v.addEventListener('play',sync);v.addEventListener('pause',sync);
  btn.addEventListener('click',function(){if(v.paused){delete v.dataset.userPaused;v.play().catch(function(){});}else{v.dataset.userPaused='1';v.pause();}});
  /* 소리 없는 배경 영상은 접속하자마자 자동 재생. 저전력 모드 등으로 막히면 첫 터치·스크롤 때 다시 시도 */
  v.muted=true;v.defaultMuted=true;v.setAttribute('muted','');v.setAttribute('autoplay','');
  function tryPlay(){if(v.dataset.userPaused)return;var p=v.play();if(p&&p.catch)p.catch(function(){});}
  tryPlay();v.addEventListener('canplay',tryPlay,{once:true});
  ['touchstart','click','scroll'].forEach(function(e){window.addEventListener(e,function(){if(v.paused)tryPlay();},{once:true,passive:true});});
  sync();
})();
</script>
