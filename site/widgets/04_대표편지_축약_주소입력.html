<!-- 천운에어컨 | 04 대표 편지(축약본) | 코드 위젯에 통째로 붙여넣기
     바꿀 곳: [회사소개페이지주소] -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..900&display=swap');
/* 공통 색 (바꾸면 이 위젯 전체 색이 바뀜) */
.cw-w04 .cw{--frame:#15182b;--ink:#1d2033;--muted:#6a6e84;--paper:#fbfbff;--line:#e3e5f2;--cline:#e6e8f4;--green:#d9dbf8;--green-l:#f3f5fc;--green-d:#6870ba;--green-t:#dce2f8;--dark:#23274a;--grad:linear-gradient(to bottom right,#dfedfc 0%,#dfedfc 20%,#ede4fb 60%,#ede4fb 100%);--grad-l:linear-gradient(to bottom right,#ebf3fd 0%,#ebf3fd 20%,#f2ecfc 60%,#f2ecfc 100%);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:500;font-size:16px;letter-spacing:-.045em;line-height:1.6;color:var(--ink);background:var(--frame);padding:0 12px;word-break:keep-all;box-sizing:border-box}
:where(.cw-w04 .cw) *,:where(.cw-w04 .cw) *::before,:where(.cw-w04 .cw) *::after{box-sizing:inherit;margin:0;padding:0}
.cw-w04 .cw a{color:inherit;text-decoration:none}
.cw-w04 .cw-in{background:var(--paper);padding:45px 42px 48px}
.cw-w04 .cw-wrap{max-width:1320px;margin:0 auto}
.cw-w04 .cw .cw-pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border:0;border-radius:40px;padding:14px 24px;background:#fff;color:#261c33;font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:transform .2s,background .2s}
.cw-w04 .cw .cw-pill--green{background:var(--grad)}
.cw-w04 .cw .cw-pill--dark{background:var(--dark);color:#fff}
@media (hover:hover){.cw-w04 .cw .cw-pill:hover{transform:translateY(-2px);background:#d4ddf3;color:#261c33}}
.cw-w04 .cw-label{font-size:14px;color:#646b7d;margin-bottom:17px}
.cw-w04 .cw-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
.cw-w04 .cw-head h2{font-size:31px;font-weight:800;letter-spacing:-.07em;line-height:1.3}
.cw-w04 .cw-tag{display:inline-block;vertical-align:middle;margin-left:12px;border:1px solid #ced7eb;border-radius:20px;padding:5px 11px;color:var(--green-d);font-size:12px;font-weight:500;letter-spacing:-.03em}
.cw-w04 .cw-link{font-size:14px;border-bottom:1px solid #b3b9c8;padding-bottom:4px;white-space:nowrap}
.cw-w04 .cw-body{font-size:15px;line-height:1.85;color:var(--muted)}
@media (max-width:900px){.cw-w04 .cw{padding:0 8px}.cw-w04 .cw-in{padding:32px 25px}}
@media (max-width:560px){.cw-w04 .cw-in{padding:28px 20px}.cw-w04 .cw-head h2{font-size:25px}.cw-w04 .cw-tag{display:none}.cw-w04 .cw-link{font-size:12px}}
@media (prefers-reduced-motion:reduce){.cw-w04 .cw *{transition:none!important}}
.cw-w04 .cw-in{padding-top:38px}
.cw-w04 .cw-letter{padding:34px 36px;background:var(--grad-l);border-radius:20px;display:grid;grid-template-columns:1fr 1.1fr;gap:36px;align-items:center}
.cw-w04 .cw-letter h2{font-size:32px;line-height:1.3;letter-spacing:-.07em;font-weight:800}
.cw-w04 .cw-letter h2 em{font-style:normal;color:var(--green-d)}
.cw-w04 .cw-letter blockquote{font-size:17px;line-height:1.9;color:#3e4454}
.cw-w04 .cw-letter__wish{margin-top:14px;font-size:16px;font-weight:800;letter-spacing:-.05em;line-height:1.7;color:var(--green-d)}
.cw-w04 .cw-letter__sign{margin:16px 0 22px;font-size:14px;color:#646b7d}
@media (max-width:900px){.cw-w04 .cw-letter{grid-template-columns:1fr;gap:16px}}
@media (max-width:560px){.cw-w04 .cw-letter{padding:24px 22px}.cw-w04 .cw-letter h2{font-size:26px}.cw-w04 .cw-letter blockquote{font-size:16px}}
</style>
<div class="cw-w04">

<section class="cw" aria-label="대표 인사말">
  <div class="cw-in"><div class="cw-wrap">
    <div class="cw-letter">
      <div>
        <p class="cw-label">대표 인사말</p>
        <h2>깨끗한 공기만큼은<br><em>운에 맡기지 않겠습니다.</em></h2>
      </div>
      <div>
        <blockquote>손님이 문을 열고 들어왔을 때 “여기 공기 좋다”고 느끼실 수 있도록, 한 대 한 대 정성껏 닦아내겠습니다.</blockquote>
        <p class="cw-letter__wish">저희와 닿는 모든 인연에 작은 행운이 깃들기를 바랍니다.</p>
        <p class="cw-letter__sign">— 천운에어컨 대표 드림</p>
        <a class="cw-pill cw-pill--dark" href="/about">편지 전문 읽기</a>
      </div>
    </div>
  </div></div>
</section>
</div>
